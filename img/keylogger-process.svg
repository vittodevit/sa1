<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="klTitle klDesc">
  <title id="klTitle">The keystroke logging process</title>
  <desc id="klDesc">
    A key pressed on the keyboard travels through the operating system to the web
    application. A keylogger running inside the operating system copies the
    keystroke on the way, writes it to a log file, and the log reaches a
    cybercriminal.
  </desc>

  <defs>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#91e5f6"></path>
    </marker>
    <marker id="arrowThief" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e7404d"></path>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

    <!-- Normal path: what the user types, and where it is supposed to go. -->
    <g>
      <rect x="35" y="40" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="115" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">User's keystrokes</text>
      <text x="115" y="86" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#91e5f6">"PasswOrd!"</text>
    </g>

    <line x1="196" y1="72" x2="238" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"></line>

    <g>
      <rect x="245" y="40" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="325" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">Keyboard</text>
      <text x="325" y="86" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#c5cbe8">keyboard driver</text>
    </g>

    <line x1="406" y1="72" x2="448" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"></line>

    <g>
      <rect x="455" y="40" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="535" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">Operating System</text>
      <text x="535" y="86" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#c5cbe8">keystroke hooks</text>
    </g>

    <line x1="616" y1="72" x2="658" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"></line>

    <g>
      <rect x="665" y="40" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="745" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">Web App</text>
      <text x="745" y="86" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#c5cbe8">login form</text>
    </g>

    <!-- The interception: a copy is taken from the same path. -->
    <line x1="535" y1="105" x2="535" y2="144" stroke="#e7404d" stroke-width="1.5"
          stroke-dasharray="4 3" marker-end="url(#arrowThief)"></line>
    <text x="547" y="129" font-size="10"
          font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
          fill="#c5cbe8">captures</text>

    <g>
      <rect x="455" y="150" width="160" height="64" rx="10"
            fill="rgba(231,64,77,0.10)" stroke="#e7404d" stroke-opacity="0.7"
            stroke-dasharray="5 4"></rect>
      <text x="535" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#ffb3aa">Keylogger</text>
      <text x="535" y="196" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#ffb3aa">API hook / driver</text>
    </g>

    <line x1="535" y1="215" x2="535" y2="244" stroke="#e7404d" stroke-width="1.5"
          stroke-dasharray="4 3" marker-end="url(#arrowThief)"></line>
    <text x="547" y="235" font-size="10"
          font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
          fill="#c5cbe8">writes</text>

    <g>
      <rect x="455" y="250" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="535" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">Log file</text>
      <text x="535" y="296" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#91e5f6">"PasswOrd!"</text>
    </g>

    <!-- Exfiltration: the log leaves the machine. -->
    <line x1="616" y1="282" x2="658" y2="282" stroke="#e7404d" stroke-width="1.5"
          stroke-dasharray="5 4" marker-end="url(#arrowThief)"></line>

    <g>
      <rect x="665" y="250" width="160" height="64" rx="10"
            fill="#133c55" stroke="rgba(145,229,246,0.32)"></rect>
      <text x="745" y="276" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f6f9">Cybercriminal</text>
      <text x="745" y="296" text-anchor="middle" font-size="10.5"
            font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
            fill="#c5cbe8">buys the log</text>
    </g>

    <!-- Legend, so the two line styles are not left to guesswork. -->
    <g font-size="11" fill="#c5cbe8">
      <rect x="35" y="256" width="18" height="12" rx="3"
            fill="none" stroke="#e7404d" stroke-dasharray="4 3"></rect>
      <text x="62" y="266">interception point</text>

      <line x1="35" y1="294" x2="57" y2="294" stroke="#91e5f6" stroke-width="1.5"
            marker-end="url(#arrowFlow)"></line>
      <text x="62" y="298">normal keystroke path</text>

      <line x1="35" y1="324" x2="57" y2="324" stroke="#e7404d" stroke-width="1.5"
            stroke-dasharray="5 4" marker-end="url(#arrowThief)"></line>
      <text x="62" y="328">movement of stolen data</text>
    </g>

  </g>
</svg>
