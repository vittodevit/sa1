<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" aria-labelledby="klTitle klDesc" role="img" viewBox="0 0 860 400"><title id="klTitle">The keystroke logging process</title><desc id="klDesc">A key pressed on the keyboard travels through the operating system to the web application. A keylogger running inside the operating system copies the keystroke on the way, writes it to a log file, and the log reaches a cybercriminal.</desc><defs><marker id="arrowFlow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#91e5f6" d="M 0 0 L 10 5 L 0 10 Z"/></marker><marker id="arrowThief" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e7404d" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs><g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"><g><rect width="160" height="64" x="35" y="40" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="115" y="66" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">User&apos;s keystrokes</text><text x="115" y="86" fill="#91e5f6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">&quot;PasswOrd!&quot;</text></g><line x1="196" x2="238" y1="72" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"/><g><rect width="160" height="64" x="245" y="40" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="325" y="66" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">Keyboard</text><text x="325" y="86" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">keyboard driver</text></g><line x1="406" x2="448" y1="72" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"/><g><rect width="160" height="64" x="455" y="40" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="535" y="66" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">Operating System</text><text x="535" y="86" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">keystroke hooks</text></g><line x1="616" x2="658" y1="72" y2="72" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"/><g><rect width="160" height="64" x="665" y="40" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="745" y="66" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">Web App</text><text x="745" y="86" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">login form</text></g><line x1="535" x2="535" y1="105" y2="144" stroke="#e7404d" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arrowThief)"/><text x="547" y="129" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10">captures</text><g><rect width="160" height="64" x="455" y="150" fill="rgba(231,64,77,0.10)" stroke="#e7404d" stroke-dasharray="5 4" stroke-opacity=".7" rx="10"/><text x="535" y="176" fill="#ffb3aa" font-size="14" font-weight="600" text-anchor="middle">Keylogger</text><text x="535" y="196" fill="#ffb3aa" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">API hook / driver</text></g><line x1="535" x2="535" y1="215" y2="244" stroke="#e7404d" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#arrowThief)"/><text x="547" y="235" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10">writes</text><g><rect width="160" height="64" x="455" y="250" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="535" y="276" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">Log file</text><text x="535" y="296" fill="#91e5f6" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">&quot;PasswOrd!&quot;</text></g><line x1="616" x2="658" y1="282" y2="282" stroke="#e7404d" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrowThief)"/><g><rect width="160" height="64" x="665" y="250" fill="#133c55" stroke="rgba(145,229,246,0.32)" rx="10"/><text x="745" y="276" fill="#f4f6f9" font-size="14" font-weight="600" text-anchor="middle">Cybercriminal</text><text x="745" y="296" fill="#c5cbe8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, monospace" font-size="10.5" text-anchor="middle">buys the log</text></g><g fill="#c5cbe8" font-size="11"><rect width="18" height="12" x="35" y="256" fill="none" stroke="#e7404d" stroke-dasharray="4 3" rx="3"/><text x="62" y="266">interception point</text><line x1="35" x2="57" y1="294" y2="294" stroke="#91e5f6" stroke-width="1.5" marker-end="url(#arrowFlow)"/><text x="62" y="298">normal keystroke path</text><line x1="35" x2="57" y1="324" y2="324" stroke="#e7404d" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrowThief)"/><text x="62" y="328">movement of stolen data</text></g></g></svg>